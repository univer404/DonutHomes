name: SupaHomes
version: 1.0.0
main: com.supahomes.SupaHomes
api-version: '1.21'
description: SupaHomes with GUI, permissions, YAML persistence, and cancellable teleport countdowns.
author: univer404
softdepend: [SuperTeams, Teams]
commands:
  home:
    description: Open your homes menu or teleport to a home.
    usage: /home [1-5|set|delete <slot>]
    aliases: [homesmenu]
    permission: supahomes.use
  homes:
    description: Open your homes menu.
    usage: /homes
    permission: supahomes.use
  sethome:
    description: Create a home.
    usage: /sethome [1-5]
    permission: supahomes.sethome
  delhome:
    description: Delete a home after confirmation.
    usage: /delhome <1-5>
    permission: supahomes.delete
  supahomes:
    description: SupaHomes administration.
    usage: /supahomes reload
    permission: supahomes.admin
permissions:
  supahomes.use:
    default: true
  supahomes.sethome:
    default: true
  supahomes.delete:
    default: true
  supahomes.limit.1:
    default: false
  supahomes.limit.2:
    default: false
  supahomes.limit.3:
    default: false
  supahomes.limit.4:
    default: false
  supahomes.limit.5:
    default: false
  homes.default:
    default: false
  homes.supaplus:
    default: false
  supahomes.teamhome:
    default: false
  supahomes.admin:
    default: op
